name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build tests
        run: npm run test:build

      - name: Run API tests
        run: npm run test:api

      # Visual tests skipped in CI - platform-specific snapshots (darwin vs linux)
      # Run locally with: npm run test:visual
